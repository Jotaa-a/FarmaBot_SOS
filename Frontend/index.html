<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmaBot SOS · FarmaSalud</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" role="application" aria-label="Baymax, asistente de farmacia">

  <header>
    <div class="avatar" aria-hidden="true">
        <img src="./media/jeta.png" alt="">
    </div>
    <div class="header-text">
      <div class="brand">Baymax</div>
      <div class="status"><span class="dot" aria-hidden="true"></span> Baymax · en línea</div>
    </div>
  </header>

  <div class="chat" id="chat" aria-live="polite"></div>

  <form class="composer" id="composer">
    <textarea id="userInput" rows="1" placeholder="Escribe tu síntoma o pregunta…" aria-label="Escribe tu mensaje"></textarea>
    <button class="send" type="submit" id="sendBtn" aria-label="Enviar mensaje">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/>
      </svg>
    </button>
  </form>
  <div class="foot-note">No reemplazamos la valoración de un médico o farmacéutico. En caso de emergencia, llama al 123.</div>
</div>

<script src="script.js"></script>

</body>
</html>
