<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmaBot SOS · FarmaSalud</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" role="application" aria-label="FarmaBot SOS, asistente de farmacia">

  <header>
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f4f8f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v6M12 16v6M2 12h6M16 12h6"/>
        <circle cx="12" cy="12" r="3.2"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="brand">FarmaBot SOS</div>
      <div class="status"><span class="dot" aria-hidden="true"></span> FarmaSalud · en línea</div>
    </div>
    <button class="gear" id="gearBtn" type="button" aria-label="Configurar conexión" aria-expanded="false" aria-controls="settingsPanel">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <div class="settings" id="settingsPanel">
    <label for="webhookUrl">URL base de la API (Spring Boot)</label>
    <div class="row">
      <input type="text" id="webhookUrl" placeholder="http://localhost:8080/api">
      <button class="save-btn" id="saveWebhook" type="button">Guardar</button>
    </div>
    <div class="mode-note" id="modeNote">Sin URL configurada: la demo usa un clasificador de prueba en el navegador para simular el triaje y la búsqueda RAG.</div>
  </div>

  <div class="chat" id="chat" aria-live="polite"></div>

  <form class="composer" id="composer">
    <textarea id="userInput" rows="1" placeholder="Escribe tu síntoma o pregunta…" aria-label="Escribe tu mensaje"></textarea>
    <button class="send" type="submit" id="sendBtn" aria-label="Enviar mensaje">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/>
      </svg>
    </button>
  </form>
  <div class="foot-note">FarmaBot SOS no reemplaza la valoración de un médico o farmacéutico. En caso de emergencia, llama al 123 o al 911.</div>
</div>

<script src="script.js"></script>

</body>
</html>
